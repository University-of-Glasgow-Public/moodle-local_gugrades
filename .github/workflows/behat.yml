name: Moodle Behat Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Allow manual triggering

jobs:
  behat-test:
    runs-on: ubuntu-22.04
    
    services:
      mariadb:
        image: mariadb:10
        env:
          MYSQL_USER: 'root'
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
          MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
          MYSQL_COLLATION_SERVER: "utf8mb4_unicode_ci"
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3']
        moodle-branch: ['MOODLE_405_STABLE']
        database: [mariadb]
    
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Check out required Glasgow plugins
        uses: actions/checkout@v4
        with:
          repository: University-of-Glasgow-Public/moodle
          ref: 4dec2bddc56908b9def98b376cb860b61428d8cc
          path: dependency-source
          persist-credentials: false
          sparse-checkout: |
            enrol/gudatabase
            local/guldap
            local/guprivacy
            report/guid

      - name: Prepare required plugins
        run: |
          mkdir -p ci-plugins
          cp -R dependency-source/enrol/gudatabase ci-plugins/enrol_gudatabase
          cp -R dependency-source/local/guldap ci-plugins/local_guldap
          cp -R dependency-source/local/guprivacy ci-plugins/local_guprivacy
          cp -R dependency-source/report/guid ci-plugins/report_guid
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ matrix.database }}, gd, zip, soap, intl
          ini-values: max_input_vars=5000
          coverage: none
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      
      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV
      
      - name: Install Moodle
        run: |
          set -x  # Enable verbose output
          moodle-plugin-ci install --plugin ./plugin --extra-plugins ./ci-plugins --db-host=127.0.0.1 -vvv
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}
      
      - name: Run Behat tests
        run: moodle-plugin-ci behat --profile firefox
      
      - name: Upload Behat screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: behat-screenshots-${{ matrix.php }}-${{ matrix.moodle-branch }}
          path: ${{ github.workspace }}/moodledata/behat_dump/**/*.png

      - name: Upload Behat Faildump
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: behat-faildump
          path: ${{ github.workspace }}/moodledata/behat_dump
          if-no-files-found: ignore
